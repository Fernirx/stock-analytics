name: stock-analytics

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stock_app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../app:/workspace/app
      - ../web:/workspace/web
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stock_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    depends_on:
      - clickhouse
      - kafka
    networks:
      - stock_net
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  crawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stock_crawler
    volumes:
      - ../app:/workspace/app
    env_file:
      - ../.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS:-2}
    depends_on:
      - kafka
    networks:
      - stock_net
    command: ["python", "-m", "app.crawler.producer"]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: stock_kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTUiTwyMV46Hgkg"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - stock_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stock_kafka_ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stock-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - stock_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: stock_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-stock_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - clickhouse_data:/var/lib/clickhouse
    depends_on:
      - kafka
    networks:
      - stock_net

networks:
  stock_net:
    driver: bridge

volumes:
  kafka_data:
  clickhouse_data:
